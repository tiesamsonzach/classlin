# coturn 示例。给以后校外通话用，不要直接拿到现网机器上启动。
# 把下面的密钥换成和服务器 TURN_SECRET 相同的一串，realm 换成你的域名。
# 网页服务器不会读这个文件。docker compose --profile turn 用的是 compose 里的命令行参数。
#
# 需要放行的端口（不要用 Caddy 反向代理这些端口）：
#   TCP/UDP 3478          信令
#   UDP 49160-49200       媒体中继，和 min-port / max-port 一致

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET
realm=notify.example.com
total-quota=100
stale-nonce=600
min-port=49160
max-port=49200
no-multicast-peers
no-cli
log-file=stdout
