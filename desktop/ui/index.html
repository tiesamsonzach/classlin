<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课堂通知</title>
  <link rel="stylesheet" href="ui.css">
  <script src="scale.js"></script>
</head>
<body class="main">
  <header class="main-hero pine">
    <p class="brand">课堂通知</p>
    <h1 id="title">把这个编号发给手机</h1>
  </header>
  <main class="main-body">
    <section class="id-card" aria-label="教室编号">
      <p class="id-label">教室编号</p>
      <p id="big-id" class="big-id">--------</p>
      <button type="button" id="copy-id" class="primary">复制编号</button>
      <p id="copy-note" class="hint">手机打开同一网址，填这一串就能发。</p>
    </section>

    <section id="setup">
      <p class="hint">服务器地址只填一次。之后日常：看这块编号 → 手机照着填。</p>
      <label for="s-url">服务器地址</label>
      <input id="s-url" placeholder="https://notify.example.com" autocomplete="off" spellcheck="false">
      <label for="s-token">口令（服务器没设就留空）</label>
      <input id="s-token" maxlength="64" placeholder="和网页上相同，可不填" autocomplete="off" spellcheck="false">
      <p id="setup-error" class="bad" role="status"></p>
      <button type="button" id="save-setup" class="primary">保存并连接</button>
      <p class="hint">关掉窗口后程序留在托盘。托盘图标上也能看到这个编号。</p>
    </section>

    <section id="home" hidden>
      <p class="conn"><span id="dot" class="dot off"></span><span id="conn-text">未连接</span></p>

      <section class="compose-card" aria-label="发送到本教室">
        <h2>发送文字 / 图片</h2>
        <label for="compose-text">内容</label>
        <textarea id="compose-text" maxlength="2000" rows="3" placeholder="写一句话，发给本教室频道（手机历史也能看到）"></textarea>
        <div class="compose-actions">
          <button type="button" id="compose-pick" class="secondary slim-inline">添加照片</button>
          <button type="button" id="compose-clear" class="secondary slim-inline" hidden>移除照片</button>
          <button type="button" id="compose-send" class="primary slim-inline">发送</button>
        </div>
        <input id="compose-file" type="file" accept="image/*" hidden>
        <img id="compose-preview" class="compose-preview" alt="待发送照片" hidden>
        <p id="compose-status" class="hint" role="status"></p>
      </section>

      <section class="call-card" aria-label="视频对讲">
        <div class="home-head">
          <h2>视频对讲</h2>
          <button type="button" id="call-toggle" class="secondary slim-inline">打开面板</button>
        </div>
        <div id="call-panel" hidden>
          <p class="hint">手机打开同一教室网页后，可点「开始对讲」。需摄像头与麦克风权限。目前仅用公共 STUN，部分网络可能连不上（需自建 TURN）。</p>
          <div class="videos">
            <video id="local-video" playsinline autoplay muted></video>
            <video id="remote-video" playsinline autoplay></video>
          </div>
          <p id="call-status" class="hint" role="status">空闲</p>
          <div class="compose-actions">
            <button type="button" id="call-start" class="primary slim-inline">开始对讲</button>
            <button type="button" id="call-accept" class="primary slim-inline" hidden>接听</button>
            <button type="button" id="call-hangup" class="secondary slim-inline">挂断</button>
          </div>
        </div>
      </section>

      <div class="home-head">
        <h2 id="home-channel">最近消息</h2>
        <button type="button" id="refresh" class="secondary slim-inline">刷新</button>
      </div>
      <p id="list-status" class="hint" role="status"></p>
      <p id="empty" class="hint" hidden>还没有消息。用手机打开服务器网页，输入上面的教室编号即可发送。</p>
      <div id="list" class="list"></div>
      <details id="settings">
        <summary>设置</summary>
        <label for="url">服务器地址</label>
        <input id="url" autocomplete="off" spellcheck="false">
        <label for="channel">教室编号</label>
        <div class="row">
          <input id="channel" maxlength="32" autocomplete="off" spellcheck="false">
          <button type="button" id="regen" class="secondary slim-inline">换一个</button>
        </div>
        <label for="token">口令</label>
        <input id="token" maxlength="64" autocomplete="off" spellcheck="false">
        <p id="save-error" class="bad" role="status"></p>
        <button type="button" id="save" class="primary">保存并重新连接</button>
      </details>
      <p class="hint">关掉这个窗口不会退出。新消息会弹出大窗口，并出现系统通知。</p>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
